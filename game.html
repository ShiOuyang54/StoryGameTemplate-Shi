
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Lily's Missing Phone</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">Mystery Game</a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNavbar"
                    aria-controls="mainNavbar"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="game.html">Game</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="about.html">About Me</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-4">

        <div class="row">
            <div class="col-12">
                <header>
                    <h1 id="scene-title" class="heading"></h1>
                    <h2 id="character-name"></h2>
                </header>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <section class="card border border-primary p-3 mb-3">
                    <p id="scene-text"></p>
                    <img id="scene-image" src="" alt="Game Scene"
                         width="400" class="img-fluid">
                </section>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <section class="card border border-primary p-3 mb-3">
                    <div id="choices-container"></div>
                </section>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <section class="card border border-primary p-3 mb-3">
                    <p>Current HP:</p>
                    <p id="health-display">100</p>

                    <p>Inventory:</p>

                    <div id="inventory-box">
                        <p id="inventory-display"></p>
                        <p id="message-display"></p>
                    </div>
                </section>
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
