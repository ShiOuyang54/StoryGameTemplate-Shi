
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost Cat</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <div class="container">

    <h1 class="display-1 text-center text-danger">Lost Cat!</h1>

    <p>My cat Mochi is missing.</p>
    <p>She is a small and cute cat.</p>
    <p>Please help me find her!</p>

    <div id="catCarousel" class="carousel slide">

      <div class="carousel-inner">

        <div class="carousel-item active">
          <img src="https://placecats.com/600/400"
               class="d-block w-100" alt="Cat 1">
        </div>

        <div class="carousel-item">
          <img src="https://placecats.com/601/400"
               class="d-block w-100" alt="Cat 2">
        </div>

        <div class="carousel-item">
          <img src="https://placecats.com/602/400"
               class="d-block w-100" alt="Cat 3">
        </div>

      </div>

      <button class="carousel-control-prev" type="button"
              data-bs-target="#catCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>

      <button class="carousel-control-next" type="button"
              data-bs-target="#catCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>

    </div>

    <div class="border border-primary p-3 mt-3">
      <p>If you see Mochi, please contact me!</p>
    </div>

    <div class="mt-3">
      <a href="#contact" class="btn btn-primary btn-lg">
        Contact Me
      </a>

      <button class="btn btn-secondary btn-sm" disabled>
        Disabled
      </button>
    </div>

    <form id="contact" class="mt-4">

      <label for="name" class="form-label">Name</label>
      <input type="text" class="form-control" id="name">

      <label for="email" class="form-label mt-3">Email</label>
      <input type="email" class="form-control" id="email">

    </form>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
