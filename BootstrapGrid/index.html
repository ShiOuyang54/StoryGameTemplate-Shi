
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cake and Desserts Grid</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <div class="container mt-4">

    <div class="row">

      <div class="col-6 bg-light border border-primary border-3 p-3"
           style="border-style: solid !important;">
        <img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=400&h=300&fit=crop"
             class="img-fluid w-100" alt="Chocolate Cake">
        <p>Chocolate Cake</p>
      </div>

      <div class="col-6 bg-warning-subtle border border-success border-3 p-3"
           style="border-style: dashed !important;">
        <img src="https://images.unsplash.com/photo-1464305795204-6f5bbfc7fb81?w=400&h=300&fit=crop"
             class="img-fluid w-100" alt="Fruit Pie">
        <p>Fruit Pie</p>
      </div>

    </div>

    <div class="row">

      <div class="col-6 bg-info-subtle border border-danger border-3 p-3"
           style="border-style: dotted !important;">
        <img src="https://images.unsplash.com/photo-1488477181946-6428a0291777?w=400&h=300&fit=crop"
             class="img-fluid w-100" alt="Strawberry Dessert">
        <p>Strawberry Dessert</p>
      </div>

      <div class="col-6 bg-success-subtle border border-dark border-3 p-3"
           style="border-style: solid !important;">
        <img src="https://images.unsplash.com/photo-1565958011703-44f9829ba187?w=400&h=300&fit=crop"
             class="img-fluid w-100" alt="Raspberry Cake">
        <p>Raspberry Cake</p>
      </div>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
