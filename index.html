
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Lily's Missing Phone</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">Mystery Game</a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNavbar"
                    aria-controls="mainNavbar"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="game.html">Game</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="about.html">About Me</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="container mt-4">
        <h1 class="heading">Find Lily's Missing Phone</h1>
    </header>

    <main class="container">

        <div class="row">
            <div class="col-12">
                <p class="card border border-primary p-3">
                    Welcome to my mystery game! Help Lily find her missing phone by following clues.
                </p>
            </div>
        </div>

        <div class="row">
            <div class="col-12">

                <section class="card border border-primary p-4">
                    <form action="game.html" method="get">

                        <div class="mb-3">
                            <label for="playerName" class="form-label">What is your name?</label>
                            <input type="text" class="form-control"
                                   id="playerName" name="playerName" required>
                        </div>

                        <div class="mb-3">
                            <label for="grade" class="form-label">What grade are you in?</label>
                            <select class="form-select" id="grade" name="grade">
                                <option value="9">9th Grade</option>
                                <option value="10">10th Grade</option>
                                <option value="11">11th Grade</option>
                                <option value="12">12th Grade</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="strategy" class="form-label">How will you find the phone?</label>
                            <input type="text" class="form-control"
                                   id="strategy" name="strategy"
                                   placeholder="Enter your plan">
                        </div>

                        <button type="submit" class="btn btn-primary">
                            Start Game
                        </button>

                    </form>
                </section>

            </div>
        </div>

        <div class="row mt-3">
            <div class="col-12">
                <a href="about.html" class="btn btn-outline-primary">About Me</a>
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
